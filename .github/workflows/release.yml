name: Build, test and release CSI Radar
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host regressions
        run: SANITIZE=1 sh tools/run_tests.sh
      - name: Build the API 87.1 FAP
        run: |
          python -m pip install ufbt==0.2.6
          ufbt update --hw-target f7 --url https://github.com/Next-Flip/Momentum-Firmware/releases/download/mntm-012/flipper-z-f7-sdk-mntm-012.zip
          cd flipper_app
          ufbt
          cmp dist/csi_radar.fap ../ready/csi_radar.fap || echo 'Build bytes may differ; source build succeeded. Release retains the local validated binary.'
      - name: Check release file hashes
        run: sha256sum --check SHA256SUMS.txt
  esp32-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S2 source
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd esp32
          idf.py set-target esp32s2
          idf.py build
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test-and-build, esp32-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package the locally validated release files
        run: python tools/package_release.py
      - name: Publish v1.0.0 once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; leave the existing tag and assets unchanged.'
            exit 0
          fi
          gh release create v1.0.0 ready/csi_radar.fap release-output/flipper-csi-v1.0.0.zip release-output/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'CSI Radar v1.0.0 — E11 / API 87.1' --notes-file RELEASE_NOTES.md --latest
