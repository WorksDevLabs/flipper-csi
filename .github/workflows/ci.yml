name: CI build and tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flipper-csi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  host-and-fap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: SANITIZE=1 sh tools/run_tests.sh
      - name: API 87.1 build
        run: |
          python -m pip install ufbt==0.2.6
          ufbt update --hw-target f7 --url https://github.com/Next-Flip/Momentum-Firmware/releases/download/mntm-012/flipper-z-f7-sdk-mntm-012.zip
          cd flipper_app
          ufbt
  esp32s2:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd esp32
          idf.py set-target esp32s2
          idf.py build
